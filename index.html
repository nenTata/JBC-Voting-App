<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- FOR PWA  -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075620">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JBC Voting">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <!-- -------- -->

  <title>JBC — Sign In</title>
  <link rel="stylesheet" href="index.css" />



</head>
<body>

  <div class="page-wrap">

    <!-- Left panel: branding -->
    <div class="brand-panel">
      <div class="brand-inner">

        <div class="logo-wrap">
        <img src="JBC_Logo.png" alt="JBC Logo">
      </div>
        <h1 class="brand-title">Judicial and Bar Council</h1>
        <div class="brand-divider"></div>
        <p class="brand-desc">
          Secure deliberation portal for<br>
          JBC member nominations.
        </p>
      </div>
      <div class="brand-footer">Confidential — Authorized Access Only</div>
    </div>

    <!-- Right panel: login form -->
    <div class="form-panel">
      <div class="form-inner">

        <div class="form-header">
          <span class="form-topTitle">Nomination Portal</span>
          <h2 class="form-title">Sign in</h2>
        </div>

        <!-- Error banner -->
        <div class="error-banner hidden" id="errorBanner">
          <span class="error-icon">!</span>
          <span id="errorText">Invalid email or password.</span>
        </div>

        <!-- Fields -->
        <div class="field-group">
          <label class="field-label" for="email">Email address</label>
          <input
            class="field-input"
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            placeholder="you@jbc.gov.ph"
            required
          />
        </div>

        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="input-wrap">
            <input
              class="field-input"
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
            <button class="toggle-pw" type="button" id="togglePw" aria-label="Show password">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button class="btn-signin" id="btnSignin" type="button">
          <span id="btnLabel">Sign In</span>
          <span class="btn-spinner hidden" id="btnSpinner"></span>
        </button>

        <p class="form-note">
          Access restricted to authorized JBC members.<br>
          Contact your administrator if you cannot log in.
        </p>

      </div>
    </div>

  </div>

  <script src="api.js"></script>
  <script src="index.js"></script>

  <!-- PWA SERVICE WORKER -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(() => console.log('JBC: Service worker registered.'))
          .catch(err => console.log('JBC: Service worker error:', err));
      });
    }
  </script>
  <!-- ------------------- -->

</body>
</html>
